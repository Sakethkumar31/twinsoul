name: Sync Instagram Gallery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: instagram-gallery-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_COOKIE: ${{ secrets.IG_COOKIE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gallery sync
        shell: pwsh
        run: |
          Start-Sleep -Seconds (Get-Random -Minimum 15 -Maximum 90)
          ./tools/sync_instagram_gallery.ps1 -Username twin_soulstudio -MaxPosts 24 -Cookie "$env:IG_COOKIE"

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/insta/
          git commit -m "chore: sync Instagram gallery"
          git push