name: Sync Instagram Gallery

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gallery sync
        shell: pwsh
        run: ./tools/sync_instagram_gallery.ps1 -Username twin_soulstudio -MaxPosts 24

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/insta/
          git commit -m "chore: sync Instagram gallery"
          git push
